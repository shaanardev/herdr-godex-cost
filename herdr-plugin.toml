id = "sarora.herdr-godex-cost"
name = "Herdr Codex Cost"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Estimated Codex session cost in the Herdr sidebar"
platforms = ["linux", "macos"]

[[build]]
command = ["go", "build", "-o", "bin/herdr-godex-cost", "./cmd/herdr-godex-cost"]

[[startup]]
command = ["./bin/herdr-godex-cost", "startup"]

[[actions]]
id = "refresh"
title = "Refresh Codex cost"
contexts = ["pane"]
command = ["./bin/herdr-godex-cost", "refresh"]

[[events]]
on = "pane.agent_status_changed"
command = ["./bin/herdr-godex-cost", "event"]

[[actions]]
id = "show-credits"
title = "Show estimated credits"
command = ["./bin/herdr-godex-cost", "display", "--mode", "credit"]

[[actions]]
id = "show-cost"
title = "Show dollar cost"
command = ["./bin/herdr-godex-cost", "display", "--mode", "cost"]
